steps:
  - label: ":pipeline: Checkout code and run Playwright tests"
    key: "run-playwright-tests"
    agents:
      queue: "default"  # optional — depends on your Buildkite setup
    commands:
      - echo "--- Installing dependencies"
      - npm ci
      - echo "--- Running Playwright tests"
      - npx playwright install --with-deps
      - npx playwright test --reporter=html
      - echo "--- Uploading Playwright report"
      - buildkite-agent artifact upload "playwright-report/**"
